<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зомби</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .main-screen {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 50px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .action-btn {
            padding: 25px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-go {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 180, 219, 0.4);
        }

        .btn-fight {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Result Screen */
        .result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-screen.active {
            display: flex;
        }

        .animation-container {
            text-align: center;
        }

        .rolling {
            font-size: 4rem;
            animation: roll 0.15s infinite;
        }

        @keyframes roll {
            0% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
            100% { transform: rotate(-5deg) scale(1); }
        }

        .result-display {
            font-size: 6rem;
            cursor: pointer;
            padding: 30px;
            border-radius: 20px;
            transition: all 0.3s ease;
            animation: popIn 0.5s ease-out;
        }

        .result-display:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .tap-hint {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #888;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="main-screen">
        <h1>🧟</h1>
        <div class="button-container">
            <button class="action-btn btn-go" id="btnGo">Идти</button>
            <button class="action-btn btn-fight" id="btnFight">Драться</button>
        </div>
    </div>

    <div class="result-screen" id="resultScreen">
        <div class="animation-container">
            <div class="rolling" id="rollingEmoji">🎲</div>
        </div>
        <div class="result-display" id="resultDisplay"></div>
        <div class="tap-hint">Нажми, чтобы закрыть</div>
    </div>

    <script>
        const btnGo = document.getElementById('btnGo');
        const btnFight = document.getElementById('btnFight');
        const resultScreen = document.getElementById('resultScreen');
        const rollingEmoji = document.getElementById('rollingEmoji');
        const resultDisplay = document.getElementById('resultDisplay');

        // Результаты для "Идти"
        const goResults = {
            1: '1️⃣',
            2: '2️⃣',
            3: '3️⃣',
            4: '4️⃣'
        };

        // Результаты для "Драться"
        const fightResults = {
            1: '🏃',  // бежать
            2: '🦷',  // кусать
            3: '🔪',  // рубить
            4: '🔫'   // стрелять
        };

        const rollingEmojis = ['🎲', '🎯', '⭐', '💫', '🌟', '✨', '🎰', '🎪'];

        function getRandomResult() {
            const random = Math.floor(Math.random() * 36) + 1;
            
            if (random >= 1 && random <= 11) {
                return 1;
            } else if (random >= 12 && random <= 22) {
                return 2;
            } else if (random >= 23 && random <= 29) {
                return 3;
            } else {
                return 4;
            }
        }

        function showResult(mode) {
            const result = getRandomResult();
            const results = mode === 'go' ? goResults : fightResults;
            
            resultScreen.classList.add('active');
            resultDisplay.style.display = 'none';
            rollingEmoji.style.display = 'block';
            
            let rollCount = 0;
            const maxRolls = 15;
            const rollInterval = setInterval(() => {
                rollingEmoji.textContent = rollingEmojis[Math.floor(Math.random() * rollingEmojis.length)];
                rollCount++;
                
                if (rollCount >= maxRolls) {
                    clearInterval(rollInterval);
                    rollingEmoji.style.display = 'none';
                    resultDisplay.textContent = results[result];
                    resultDisplay.style.display = 'block';
                }
            }, 100);
        }

        function closeResult() {
            resultScreen.classList.remove('active');
        }

        btnGo.addEventListener('click', () => showResult('go'));
        btnFight.addEventListener('click', () => showResult('fight'));
        resultDisplay.addEventListener('click', closeResult);
        resultScreen.addEventListener('click', (e) => {
            if (e.target === resultScreen) {
                closeResult();
            }
        });
    </script>
</body>
</html>
