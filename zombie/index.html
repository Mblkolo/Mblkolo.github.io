<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zombie Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            color: #e94560;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 25px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .btn-go {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .btn-fight {
            background: linear-gradient(135deg, #e94560 0%, #d6344f 100%);
            color: white;
        }

        .animation-container {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .result-display {
            font-size: 5rem;
            animation: popIn 0.5s ease-out;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .result-display:hover {
            transform: scale(1.1);
        }

        .result-text {
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .rolling {
            animation: roll 0.1s ease-in-out infinite;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes roll {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        .hint {
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
            animation: fadeIn 1s ease-out 0.5s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Screen -->
        <div class="screen active" id="mainScreen">
            <h1>🧟 Zombie Game</h1>
            <button class="btn btn-go" onclick="showResult('go')">🚶 Идти</button>
            <button class="btn btn-fight" onclick="showResult('fight')">⚔️ Драться</button>
        </div>

        <!-- Result Screen -->
        <div class="screen" id="resultScreen">
            <h1>🎯 Результат</h1>
            <div class="animation-container">
                <div class="result-display" id="resultDisplay" onclick="closeResult()"></div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="hint">Нажмите на результат, чтобы вернуться</div>
        </div>
    </div>

    <script>
        const actions = {
            1: { emoji: '🏃', name: 'бежать' },
            2: { emoji: '🦷', name: 'кусать' },
            3: { emoji: '🗡️', name: 'рубить' },
            4: { emoji: '🔫', name: 'стрелять' }
        };

        function getRandomAction() {
            const random = Math.floor(Math.random() * 36) + 1;
            
            if (random >= 1 && random <= 11) {
                return 1;
            } else if (random >= 12 && random <= 22) {
                return 2;
            } else if (random >= 23 && random <= 29) {
                return 3;
            } else {
                return 4;
            }
        }

        function showResult(type) {
            const mainScreen = document.getElementById('mainScreen');
            const resultScreen = document.getElementById('resultScreen');
            const resultDisplay = document.getElementById('resultDisplay');
            const resultText = document.getElementById('resultText');

            mainScreen.classList.remove('active');
            resultScreen.classList.add('active');

            // Animation - show random results
            let count = 0;
            const maxCount = 10;
            const interval = setInterval(() => {
                const tempAction = Math.floor(Math.random() * 4) + 1;
                resultDisplay.textContent = actions[tempAction].emoji;
                resultDisplay.classList.add('rolling');
                count++;

                if (count >= maxCount) {
                    clearInterval(interval);
                    resultDisplay.classList.remove('rolling');
                    
                    // Show final result
                    const actionNumber = getRandomAction();
                    const action = actions[actionNumber];
                    resultDisplay.textContent = action.emoji;
                    resultText.textContent = action.name;
                    
                    // Add pop animation
                    resultDisplay.style.animation = 'none';
                    resultDisplay.offsetHeight; // Trigger reflow
                    resultDisplay.style.animation = 'popIn 0.5s ease-out';
                }
            }, 100);
        }

        function closeResult() {
            const mainScreen = document.getElementById('mainScreen');
            const resultScreen = document.getElementById('resultScreen');

            resultScreen.classList.remove('active');
            mainScreen.classList.add('active');

            // Reset for next use
            document.getElementById('resultDisplay').textContent = '';
            document.getElementById('resultText').textContent = '';
        }

        // Prevent zoom on double tap
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        let lastTouchEnd = 0;
    </script>
</body>
</html>
